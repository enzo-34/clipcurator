<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCurator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #070709;
      --surface:    #131416;
      --surface-hi: #1c1d20;
      --border:     #282830;
      --accent:     #6b54d3;
      --accent-hi:  #8a70f0;
      --accent-dim: rgba(107,84,211,0.18);
      --text:       #e6e6ea;
      --muted:      #77778a;
      --success:    #4dba6a;
      --danger:     #e05555;
    }

    html, body {
      height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px; -webkit-font-smoothing: antialiased;
    }

    /* ── Icons ──────────────────────────────────────────────────────── */
    .icon {
      width: 16px; height: 16px; display: inline-block; vertical-align: middle;
      flex-shrink: 0; pointer-events: none;
    }
    .icon svg { width: 100%; height: 100%; }
    .icon-sm { width: 13px; height: 13px; }
    .icon-lg { width: 18px; height: 18px; }
    .icon-xl { width: 20px; height: 20px; }

    /* ── Layout ─────────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    #header {
      height: 44px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; gap: 8px; flex-shrink: 0;
    }
    .logo {
      font-weight: 700; font-size: 14px; letter-spacing: 0.4px; color: var(--accent-hi);
      display: flex; align-items: center; gap: 6px;
    }
    .logo .logo-ver { opacity: 0.5; font-weight: 400; font-size: 12px; }
    .spacer { flex: 1; }

    #queue-badge {
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 10px; border-radius: 20px; display: none;
    }

    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    #sidebar {
      width: 210px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      transition: width 0.2s ease; overflow: hidden;
    }
    #sidebar.collapsed { width: 30px; }

    #sidebar-header {
      height: 34px; padding: 0 8px; display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px;
      color: var(--muted); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sidebar-title { flex: 1; white-space: nowrap; overflow: hidden; }
    #sidebar-toggle {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 3px; border-radius: 3px; display: flex; align-items: center;
      flex-shrink: 0; transition: color 0.1s, background 0.1s;
    }
    #sidebar-toggle:hover { color: var(--text); background: var(--surface-hi); }
    #sidebar.collapsed .sidebar-title { display: none; }
    #sidebar.collapsed #clip-list     { display: none; }
    #sidebar.collapsed #sidebar-header { padding: 0; justify-content: center; }

    #clip-list { flex: 1; overflow-y: auto; padding: 3px 0; }
    #clip-list::-webkit-scrollbar { width: 4px; }
    #clip-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .clip-item {
      padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent;
      transition: background 0.08s; display: flex; align-items: center; gap: 6px;
    }
    .clip-item:hover { background: var(--surface-hi); }
    .clip-item.active { background: var(--accent-dim); border-left-color: var(--accent-hi); }
    .clip-name {
      font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .clip-status { flex-shrink: 0; opacity: 0; }
    .clip-item.queued    .clip-status { opacity: 1; color: var(--success); }
    .clip-item.done-item .clip-status { opacity: 0.4; color: var(--muted); }

    .list-empty {
      padding: 20px 12px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7;
    }

    /* ── Content ────────────────────────────────────────────────────── */
    #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #video-area {
      flex: 1; background: #000; display: flex; align-items: center; justify-content: center;
      position: relative; min-height: 0; cursor: pointer;
    }
    /* Flash overlay for double-click seek feedback */
    #video-area::before, #video-area::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 50%;
      background: rgba(255,255,255,0); transition: background 0.15s;
      pointer-events: none; z-index: 2;
    }
    #video-area::before { left: 0; border-radius: 0; }
    #video-area::after  { right: 0; }
    #video-area.flash-left::before  { background: rgba(255,255,255,0.08); }
    #video-area.flash-right::after  { background: rgba(255,255,255,0.08); }

    #video {
      max-width: 100%; max-height: 100%; width: 100%; height: 100%;
      object-fit: contain; position: relative; z-index: 1;
    }
    #no-clip {
      position: absolute; text-align: center; color: var(--muted); pointer-events: none; z-index: 3;
    }
    #no-clip h3 { font-size: 18px; margin-bottom: 6px; color: var(--surface-hi); }

    /* Seek indicator shown briefly on double-click */
    #seek-indicator {
      position: absolute; z-index: 10; pointer-events: none;
      background: rgba(0,0,0,0.55); border-radius: 8px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; color: #fff; opacity: 0;
      transition: opacity 0.2s; display: flex; align-items: center; gap: 6px;
    }
    #seek-indicator.visible { opacity: 1; }

    /* ── Controls ───────────────────────────────────────────────────── */
    #controls {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 14px 12px; flex-shrink: 0;
    }

    #time-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; font-size: 11px; color: var(--muted);
    }
    #time-current { font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    #time-total   { font-variant-numeric: tabular-nums; }

    .hint {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--surface-hi); border: 1px solid var(--border);
      border-radius: 3px; padding: 0 5px; font-size: 10px; line-height: 17px;
    }

    /* ── Timeline with draggable trim handles ───────────────────────── */
    #timeline {
      height: 26px; background: var(--surface-hi); border: 1px solid var(--border);
      border-radius: 4px; position: relative; cursor: pointer; margin-bottom: 8px;
      overflow: visible; /* allow handles to stick up slightly */
    }
    #timeline:hover { border-color: var(--border); }

    #tl-range {
      position: absolute; top: 0; height: 100%;
      background: var(--accent-dim);
      pointer-events: none;
    }
    #tl-cursor {
      position: absolute; top: -1px; width: 2px; height: calc(100% + 2px);
      background: rgba(255,255,255,0.7); border-radius: 1px;
      pointer-events: none; transform: translateX(-1px);
    }

    /* Trim handles */
    .tl-handle {
      position: absolute; top: -3px; height: calc(100% + 6px);
      width: 14px; transform: translateX(-7px);
      cursor: ew-resize; z-index: 10; touch-action: none;
    }
    .tl-handle-line {
      position: absolute; top: 0; left: 6px; width: 2px; height: 100%;
      border-radius: 1px;
    }
    /* Flag/tab on top of the handle */
    .tl-handle-tab {
      position: absolute; top: -1px; width: 10px; height: 9px;
      border-radius: 2px;
    }
    #tl-in-handle  .tl-handle-line { background: var(--accent); }
    #tl-in-handle  .tl-handle-tab  { left: 6px; background: var(--accent); border-radius: 1px 3px 3px 1px; }
    #tl-out-handle .tl-handle-line { background: var(--accent-hi); }
    #tl-out-handle .tl-handle-tab  { left: -4px; background: var(--accent-hi); border-radius: 3px 1px 1px 3px; }

    .tl-handle:hover .tl-handle-line { filter: brightness(1.3); }
    .tl-handle:hover .tl-handle-tab  { filter: brightness(1.3); }
    .tl-handle.dragging .tl-handle-line { filter: brightness(1.4); }
    .tl-handle.dragging .tl-handle-tab  { filter: brightness(1.4); }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    #transport {
      display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
    }

    .btn {
      background: var(--surface-hi); border: 1px solid var(--border); color: var(--text);
      padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: background 0.08s, border-color 0.08s;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover   { background: #252529; border-color: #3a3a44; }
    .btn:active  { background: #1e1e22; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .btn.primary:hover  { background: var(--accent-hi); border-color: var(--accent-hi); }
    .btn.primary:active { background: #5a46b8; }
    .btn.danger  { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn.danger:hover { background: #c94040; }
    .btn.icon-only { padding: 5px 7px; }
    #play-btn { min-width: 82px; }

    .mark-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
      font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.08s, color 0.08s, border-color 0.08s;
    }
    .mark-btn:hover { border-color: var(--accent-hi); color: var(--accent-hi); }

    .pts {
      display: flex; align-items: center; gap: 4px;
      font-variant-numeric: tabular-nums; font-size: 12px;
    }
    .pt-val { min-width: 56px; text-align: center; color: var(--text); }
    .pt-arrow { color: var(--muted); }
    .pt-dur { font-size: 11px; color: var(--accent-hi); min-width: 44px; }

    /* ── Label + options row ─────────────────────────────────────────── */
    #label-row { display: flex; gap: 8px; align-items: flex-end; }

    .field-group { display: flex; flex-direction: column; gap: 3px; flex: 1; position: relative; }
    .field-group label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted);
    }
    .tag-input {
      background: var(--surface-hi); border: 1px solid var(--border); color: var(--text);
      padding: 5px 8px; border-radius: 4px; font-size: 12px; font-family: inherit;
      outline: none; width: 100%;
    }
    .tag-input:focus { border-color: var(--accent); }
    .tag-input::placeholder { color: var(--muted); }

    .dropdown-list {
      position: absolute; bottom: calc(100% + 3px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 5px; overflow-y: auto; max-height: 140px;
      z-index: 100; display: none;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.6);
    }
    .dropdown-list.open { display: block; }
    .dropdown-item {
      padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text);
      border-left: 2px solid transparent;
    }
    .dropdown-item:hover, .dropdown-item.selected {
      background: var(--surface-hi); border-left-color: var(--accent-hi);
    }
    .dropdown-empty { padding: 7px 10px; font-size: 11px; color: var(--muted); font-style: italic; }

    /* ── Toggle switches ─────────────────────────────────────────────── */
    .toggle-group { display: flex; flex-direction: column; gap: 5px; justify-content: flex-end; padding-bottom: 1px; }
    .toggle-row { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    /* Fixed-width label so switch pill always lands at the same x regardless of text length */
    .toggle-row .toggle-label { font-size: 11px; color: var(--muted); white-space: nowrap; transition: color 0.15s; width: 28px; text-align: right; }
    .toggle-row:hover .toggle-label { color: var(--text); }
    .toggle-row.active .toggle-label { color: var(--accent-hi); }

    .toggle-switch { position: relative; width: 30px; height: 16px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 8px;
      background: var(--surface-hi); border: 1px solid var(--border);
      transition: background 0.18s, border-color 0.18s; cursor: pointer;
    }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--muted);
      transition: transform 0.18s, background 0.18s;
    }
    .toggle-switch input:checked ~ .toggle-track { background: var(--accent); border-color: var(--accent); }
    .toggle-switch input:checked ~ .toggle-track .toggle-thumb { transform: translateX(14px); background: #fff; }

    /* ── Footer ──────────────────────────────────────────────────────── */
    #footer {
      height: 40px; background: var(--bg); border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; gap: 10px; flex-shrink: 0;
    }
    .footer-info { font-size: 12px; color: var(--muted); }
    #progress-wrap { width: 110px; height: 5px; background: var(--surface-hi); border-radius: 3px; overflow: hidden; display: none; }
    #progress-fill { height: 100%; background: var(--accent-hi); width: 0%; transition: width 0.25s; }

    /* ── Settings ────────────────────────────────────────────────────── */
    #gear-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 7px; border-radius: 5px; cursor: pointer;
      display: inline-flex; align-items: center; transition: color 0.1s, border-color 0.1s;
    }
    #gear-btn:hover { color: var(--text); border-color: var(--accent); }
    #gear-btn.active { color: var(--accent-hi); border-color: var(--accent); }

    #settings-overlay { display: none; position: fixed; inset: 0; z-index: 300; }
    #settings-overlay.open { display: block; }
    #settings-backdrop { position: absolute; inset: 0; }

    #settings-panel {
      position: absolute; top: 50px; right: 14px; width: 340px;
      max-height: calc(100vh - 70px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #settings-title {
      padding: 11px 16px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    #settings-title span { flex: 1; }
    #settings-close {
      background: none; border: none; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; padding: 2px;
    }
    #settings-close:hover { color: var(--text); }

    #settings-body { overflow-y: auto; padding: 14px 16px; flex: 1; }
    #settings-body::-webkit-scrollbar { width: 4px; }
    #settings-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .settings-section { margin-bottom: 20px; }
    .settings-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.9px; color: var(--muted); margin-bottom: 10px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }

    .color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .color-row label { flex: 1; font-size: 12px; color: var(--text); }
    .color-preview { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
    .color-hex-input {
      width: 80px; background: var(--surface-hi); border: 1px solid var(--border);
      color: var(--text); padding: 3px 7px; border-radius: 4px; font-size: 11px;
      font-family: 'Consolas','Courier New',monospace; outline: none;
    }
    .color-hex-input:focus { border-color: var(--accent); }
    .color-hex-input.invalid { border-color: var(--danger); }

    .key-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .key-row label { flex: 1; font-size: 12px; color: var(--text); }
    .key-capture {
      width: 90px; background: var(--surface-hi); border: 1px solid var(--border);
      color: var(--accent-hi); padding: 3px 7px; border-radius: 4px; font-size: 11px;
      font-family: 'Consolas','Courier New',monospace; cursor: pointer;
      outline: none; text-align: center;
    }
    .key-capture:focus { border-color: var(--accent); background: var(--accent-dim); }
    .key-capture.listening { border-color: var(--accent-hi); animation: blink 0.7s infinite; }
    @keyframes blink { 0%,100% { border-color: var(--accent-hi); } 50% { border-color: transparent; } }

    #settings-footer { padding: 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .reset-btn {
      width: 100%; padding: 6px; background: transparent; border: 1px solid var(--border);
      color: var(--muted); border-radius: 5px; cursor: pointer; font-size: 11px;
      font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: color 0.1s, border-color 0.1s;
    }
    .reset-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* Theme toggle row in settings */
    .settings-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .settings-row label { flex: 1; font-size: 12px; color: var(--text); }
    .settings-row .theme-toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .theme-icon { color: var(--muted); display: flex; align-items: center; }

    /* Collapsible Advanced section */
    .advanced-header {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.9px; color: var(--muted); margin-bottom: 0;
      padding: 6px 0; border-bottom: 1px solid var(--border);
      user-select: none; transition: color 0.1s;
    }
    .advanced-header:hover { color: var(--text); }
    .advanced-header .adv-arrow {
      display: flex; align-items: center; margin-left: auto;
      transition: transform 0.2s;
    }
    .advanced-header.open .adv-arrow { transform: rotate(90deg); }
    .advanced-body {
      display: none; padding-top: 10px;
    }
    .advanced-body.open { display: block; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <span class="logo">
      <span class="icon icon-xl" id="logo-icon"></span>
      ClipCurator
      <span class="logo-ver">v0.1</span>
    </span>
    <span class="spacer"></span>
    <span id="queue-badge">0 queued</span>
    <button id="gear-btn" title="Settings">
      <span class="icon" id="gear-icon"></span>
    </button>
  </div>

  <div id="main">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span class="sidebar-title">Clips <span id="clip-count"></span></span>
        <button id="sidebar-toggle" title="Collapse sidebar">
          <span class="icon" id="sidebar-toggle-icon"></span>
        </button>
      </div>
      <div id="clip-list">
        <div class="list-empty">Open a folder<br>to get started</div>
      </div>
    </div>

    <!-- Main content -->
    <div id="content">

      <!-- Video -->
      <div id="video-area">
        <video id="video" preload="metadata"></video>
        <div id="no-clip">
          <h3>No clip loaded</h3>
          <p>Select a clip from the sidebar</p>
        </div>
        <div id="seek-indicator"></div>
      </div>

      <!-- Controls -->
      <div id="controls">

        <!-- Time row -->
        <div id="time-row">
          <span id="time-current">0:00.0</span>
          <span id="shortcut-hints" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;">
            <span class="hint"><span class="icon icon-sm" id="hint-in-icon"></span><span data-action="setIn">I</span> In</span>
            <span class="hint"><span class="icon icon-sm" id="hint-out-icon"></span><span data-action="setOut">O</span> Out</span>
            <span class="hint"><span data-action="togglePlay">Space</span> Play</span>
            <span class="hint"><span data-action="seekBack">&#8592;</span>/<span data-action="seekFwd">&#8594;</span> &plusmn;5s</span>
            <span class="hint"><span data-action="seekBack1">A</span>/<span data-action="seekFwd1">D</span> &plusmn;1s</span>
          </span>
          <span id="time-total">0:00.0</span>
        </div>

        <!-- Timeline -->
        <div id="timeline">
          <div id="tl-range"></div>
          <div id="tl-cursor"></div>
          <div class="tl-handle" id="tl-in-handle">
            <div class="tl-handle-tab"></div>
            <div class="tl-handle-line"></div>
          </div>
          <div class="tl-handle" id="tl-out-handle">
            <div class="tl-handle-tab"></div>
            <div class="tl-handle-line"></div>
          </div>
        </div>

        <!-- Transport -->
        <div id="transport">
          <button class="btn icon-only" id="prev-btn" title="Previous clip">
            <span class="icon" id="icon-prev"></span>
          </button>
          <button class="btn icon-only" id="rew-btn" title="Seek -5s">
            <span class="icon" id="icon-rew"></span>
          </button>
          <button class="btn" id="play-btn">
            <span class="icon" id="icon-play"></span>
            <span id="play-label">Play</span>
          </button>
          <button class="btn icon-only" id="fwd-btn" title="Seek +5s">
            <span class="icon" id="icon-fwd"></span>
          </button>
          <button class="btn icon-only" id="next-btn" title="Next clip">
            <span class="icon" id="icon-next"></span>
          </button>

          <!-- 2x speed toggle -->
          <label class="toggle-row" id="speed-toggle-row" title="2x playback speed" style="margin-left:4px;">
            <span class="toggle-label">2x</span>
            <span class="toggle-switch">
              <input type="checkbox" id="speed-toggle">
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
            </span>
          </label>

          <span class="spacer"></span>

          <button class="mark-btn" id="in-btn">
            <span class="icon icon-sm" id="icon-in"></span>
            <span>In</span>
          </button>
          <div class="pts">
            <span class="pt-val" id="in-val">--:--.--</span>
            <span class="pt-arrow">&#8594;</span>
            <span class="pt-val" id="out-val">--:--.--</span>
            <span class="pt-dur"  id="sel-dur"></span>
          </div>
          <button class="mark-btn" id="out-btn">
            <span>Out</span>
            <span class="icon icon-sm" id="icon-out"></span>
          </button>
        </div>

        <!-- Labels + toggles + add -->
        <div id="label-row">
          <div class="field-group" id="folder-group">
            <label>Game / Folder</label>
            <input class="tag-input" id="folder-input" type="text"
                   placeholder="e.g. Valorant" autocomplete="off">
            <div class="dropdown-list" id="folder-dropdown"></div>
          </div>
          <div class="field-group" id="label-group">
            <label>Category / Label</label>
            <input class="tag-input" id="label-input" type="text"
                   placeholder="e.g. Funny" autocomplete="off">
            <div class="dropdown-list" id="label-dropdown"></div>
          </div>

          <div class="toggle-group">
            <label class="toggle-row" id="compress-row" title="Compress to ~8 MB for Discord">
              <span class="toggle-label">8 MB</span>
              <span class="toggle-switch">
                <input type="checkbox" id="compress-toggle">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </span>
            </label>
            <label class="toggle-row" id="audio-row" title="Export audio only as MP3">
              <span class="toggle-label">MP3</span>
              <span class="toggle-switch">
                <input type="checkbox" id="audio-toggle">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </span>
            </label>
          </div>

          <button class="btn primary" id="add-btn">
            <span class="icon" id="icon-add"></span>
            Add to Queue
          </button>
        </div>

      </div><!-- /controls -->
    </div><!-- /content -->
  </div><!-- /main -->

  <!-- Footer -->
  <div id="footer">
    <button class="btn" id="open-btn">
      <span class="icon" id="icon-folder"></span>
      Open Folder
    </button>
    <span class="footer-info" id="folder-info">No folder open</span>
    <span class="spacer"></span>
    <div id="progress-wrap"><div id="progress-fill"></div></div>
    <span class="footer-info" id="process-info" style="display:none"></span>
    <button class="btn danger" id="cancel-btn" style="display:none">
      <span class="icon" id="icon-cancel"></span>
      Cancel
    </button>
    <button class="btn primary" id="process-btn" style="display:none">
      <span class="icon" id="icon-process"></span>
      Process Queue
    </button>
  </div>

</div><!-- /app -->

<!-- Settings overlay -->
<div id="settings-overlay">
  <div id="settings-backdrop"></div>
  <div id="settings-panel">
    <div id="settings-title">
      <span class="icon" id="settings-title-icon"></span>
      <span>Settings</span>
      <button id="settings-close">
        <span class="icon" id="icon-settings-close"></span>
      </button>
    </div>
    <div id="settings-body">

      <!-- Theme toggle -->
      <div class="settings-section">
        <div class="settings-section-title">Appearance</div>
        <div class="settings-row">
          <label>Theme</label>
          <div class="theme-toggle-wrap">
            <span class="theme-icon icon icon-sm" id="icon-moon"></span>
            <label class="toggle-row" style="margin:0">
              <span class="toggle-switch" style="margin:0">
                <input type="checkbox" id="theme-toggle">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </span>
            </label>
            <span class="theme-icon icon icon-sm" id="icon-sun"></span>
          </div>
        </div>

        <!-- Advanced collapsible -->
        <div class="advanced-header" id="advanced-toggle">
          Advanced colors
          <span class="adv-arrow icon icon-sm" id="icon-adv-arrow"></span>
        </div>
        <div class="advanced-body" id="advanced-body">
          <div class="color-row"><label>Background</label>       <div class="color-preview"></div><input class="color-hex-input" data-var="--bg"         maxlength="7"></div>
          <div class="color-row"><label>Surface</label>          <div class="color-preview"></div><input class="color-hex-input" data-var="--surface"    maxlength="7"></div>
          <div class="color-row"><label>Surface highlight</label> <div class="color-preview"></div><input class="color-hex-input" data-var="--surface-hi" maxlength="7"></div>
          <div class="color-row"><label>Accent</label>           <div class="color-preview"></div><input class="color-hex-input" data-var="--accent"     maxlength="7"></div>
          <div class="color-row"><label>Accent bright</label>    <div class="color-preview"></div><input class="color-hex-input" data-var="--accent-hi"  maxlength="7"></div>
          <div class="color-row"><label>Text</label>             <div class="color-preview"></div><input class="color-hex-input" data-var="--text"        maxlength="7"></div>
          <div class="color-row"><label>Muted text</label>       <div class="color-preview"></div><input class="color-hex-input" data-var="--muted"       maxlength="7"></div>
        </div>
      </div>

      <!-- Key bindings -->
      <div class="settings-section">
        <div class="settings-section-title">Key Bindings &mdash; click a box then press a key</div>
        <div class="key-row"><label>Play / Pause</label>    <input class="key-capture" data-action="togglePlay" readonly></div>
        <div class="key-row"><label>Set In point</label>    <input class="key-capture" data-action="setIn"      readonly></div>
        <div class="key-row"><label>Set Out point</label>   <input class="key-capture" data-action="setOut"     readonly></div>
        <div class="key-row"><label>Seek &minus;5s</label>  <input class="key-capture" data-action="seekBack"   readonly></div>
        <div class="key-row"><label>Seek +5s</label>        <input class="key-capture" data-action="seekFwd"    readonly></div>
        <div class="key-row"><label>Seek &minus;1s</label>  <input class="key-capture" data-action="seekBack1"  readonly></div>
        <div class="key-row"><label>Seek +1s</label>        <input class="key-capture" data-action="seekFwd1"   readonly></div>
        <div class="key-row"><label>Add to Queue</label>    <input class="key-capture" data-action="addToQueue" readonly></div>
        <div class="key-row"><label>Next clip</label>       <input class="key-capture" data-action="nextClip"   readonly></div>
        <div class="key-row"><label>Prev clip</label>       <input class="key-capture" data-action="prevClip"   readonly></div>
      </div>

    </div>
    <div id="settings-footer">
      <button class="reset-btn" id="reset-btn">
        <span class="icon icon-sm" id="icon-reset"></span>
        Reset to defaults
      </button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
